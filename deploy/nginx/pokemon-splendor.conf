# HTTP is retained for ACME renewal and redirects normal traffic to HTTPS.
server {
    listen 80;
    server_name pokemon.honey634546.top;

    root /var/www/pokemon-splendor;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pokemon.honey634546.top;

    ssl_certificate /etc/letsencrypt/live/pokemon.honey634546.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pokemon.honey634546.top/privkey.pem;

    root /var/www/pokemon-splendor;
    index index.html;

    location /room/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not expose runtime snapshots, source-control metadata, or server-only files.
    location ~ ^/(?:\.git|\.runtime|server|test|train|docs)(?:/|$) { deny all; }
    location ~ /\. { deny all; }
}
