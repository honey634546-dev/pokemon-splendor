# Replace the domain and repository path before enabling this server block.
server {
    listen 80;
    server_name pokemon.example.com;

    root /var/www/pokemon-splendor;
    index index.html;

    # WebSocket room endpoint. Keep this path on the same host as the page so
    # js/net.js can continue to derive its ws:// or wss:// URL automatically.
    location /room/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not expose runtime snapshots, source-control metadata, or server-only files.
    location ~ ^/(?:\.git|\.runtime|server|test|train|docs)(?:/|$) { deny all; }
    location ~ /\. { deny all; }
}
